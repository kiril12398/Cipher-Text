<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>A1Z26 Encoder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4ade80;
    --accent-dim: #166534;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    padding: 8px 0;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  textarea, .output {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .output {
    min-height: 120px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--accent);
    border-color: var(--accent-dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 1px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(0.97);
  }

  button.primary {
    background: var(--accent);
    color: #0f0f0f;
    border-color: var(--accent);
  }

  button:hover {
    border-color: var(--accent);
  }

  button.primary:hover {
    background: #3fcd70;
  }

  .footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    padding: 8px 0;
  }

  @media (min-width: 600px) {
    body { max-width: 600px; margin: 0 auto; }
  }
</style>
</head>
<body>

<h1>🔢 A1Z26</h1>

<div>
  <div class="label">Input</div>
  <textarea id="input" placeholder="Type here..." autocomplete="off" spellcheck="false"></textarea>
</div>

<div>
  <div class="label">Translation</div>
  <div class="output" id="output"></div>
</div>

<div class="row">
  <button class="primary" onclick="copyOutput()">Copy</button>
  <button onclick="clearAll()">Clear</button>
  <button onclick="swapBoxes()">↑↓</button>
</div>

<div class="footer">a=1, b=2 ... z=26 • auto-translates</div>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");

  // a=1 ... z=26, no separators (abc -> 123)
  function encode(text) {
    return text
      .toLowerCase()
      .split("")
      .map(ch => (ch >= "a" && ch <= "z") ? (ch.charCodeAt(0) - 96) : "")
      .join("");
  }

  // decode: greedy parse so 123 -> 1-2-3 (abc), 242526 -> 24-25-26 (xyz)
  // parse each 1-2 digit chunk: if next two digits form 10-26, take two; else one.
  function decode(text) {
    const digits = text.replace(/\D/g, "");
    let out = "";
    let i = 0;
    while (i < digits.length) {
      const two = digits.substr(i, 2);
      if (two.length === 2 && +two >= 10 && +two <= 26) {
        out += String.fromCharCode(96 + +two);
        i += 2;
      } else {
        const one = digits[i];
        if (+one >= 1 && +one <= 9) out += String.fromCharCode(96 + +one);
        i += 1;
      }
    }
    return out;
  }

  function update() {
    const val = input.value;
    // If it's mostly digits, decode; otherwise encode.
    const digitCount = (val.match(/\d/g) || []).length;
    const letterCount = (val.match(/[a-z]/gi) || []).length;

    if (digitCount > letterCount) {
      output.textContent = decode(val);
    } else {
      output.textContent = encode(val);
    }
  }

  input.addEventListener("input", update);

  function copyOutput() {
    const text = output.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      const old = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = old, 1200);
    });
  }

  function clearAll() {
    input.value = "";
    output.textContent = "";
    input.focus();
  }

  function swapBoxes() {
    const a = input.value;
    const b = output.textContent;
    input.value = b;
    output.textContent = a;
  }
</script>
</body>
</html>
