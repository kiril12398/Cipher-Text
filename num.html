
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1Z26 Encoder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1a1f35 0%, #0a0c14 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8ecf5;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(22, 26, 40, 0.85);
    border: 1px solid rgba(120, 140, 200, 0.15);
    border-radius: 20px;
    padding: 36px 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #7fd1ff, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 13px;
    color: #6b7590;
    margin-bottom: 28px;
  }

  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6b7590;
    margin-bottom: 8px;
    display: block;
  }

  input {
    width: 100%;
    background: rgba(10, 12, 20, 0.7);
    border: 1px solid rgba(120, 140, 200, 0.2);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 18px;
    font-family: inherit;
    color: #e8ecf5;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder { color: #4a5268; }

  input:focus {
    border-color: #7fd1ff;
    box-shadow: 0 0 0 3px rgba(127, 209, 255, 0.12);
  }

  .output-wrap {
    margin-top: 24px;
    position: relative;
  }

  #output {
    min-height: 70px;
    background: rgba(10, 12, 20, 0.7);
    border: 1px solid rgba(120, 140, 200, 0.15);
    border-radius: 12px;
    padding: 18px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: #7fd1ff;
    word-break: break-all;
    line-height: 1.5;
    transition: color 0.2s;
  }

  #output.empty { color: #4a5268; letter-spacing: 0; font-size: 14px; }

  .copy-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(127, 209, 255, 0.1);
    border: 1px solid rgba(127, 209, 255, 0.25);
    color: #7fd1ff;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
  }

  .output-wrap:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: rgba(127, 209, 255, 0.2); }
  .copy-btn.copied { color: #6ee7a8; border-color: rgba(110, 231, 168, 0.4); }
</style>
</head>
<body>
  <div class="card">
    <h1>A1Z26 Encoder</h1>
    <p class="subtitle">a = 1, b = 2, ... z = 26</p>

    <label class="label" for="input">Input</label>
    <input id="input" type="text" placeholder="type a message..." autofocus autocomplete="off" spellcheck="false">

    <div class="output-wrap">
      <label class="label">Output</label>
      <div id="output" class="empty">numbers will appear here</div>
      <button class="copy-btn" id="copy">copy</button>
    </div>
  </div>

<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  const copyBtn = document.getElementById("copy");

  function encode(text) {
    return text
      .toLowerCase()
      .split("")
      .map(ch => (ch >= "a" && ch <= "z") ? ch.charCodeAt(0) - 96 : "")
      .join("");
  }

  input.addEventListener("input", () => {
    const result = encode(input.value);
    if (result) {
      output.textContent = result;
      output.classList.remove("empty");
    } else {
      output.textContent = "numbers will appear here";
      output.classList.add("empty");
    }
  });

  copyBtn.addEventListener("click", () => {
    const text = output.textContent;
    if (!text || output.classList.contains("empty")) return;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = "copied";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyBtn.textContent = "copy";
        copyBtn.classList.remove("copied");
      }, 1400);
    });
  });
</script>
</body>
</html>
