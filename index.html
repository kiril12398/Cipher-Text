<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Cipher Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4ade80;
    --accent-dim: #166534;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    padding: 8px 0;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  textarea, .output {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .output {
    min-height: 120px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .row {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(0.97);
  }

  button.primary {
    background: var(--accent);
    color: #0f0f0f;
    border-color: var(--accent);
  }

  button:hover {
    border-color: var(--accent);
  }

  button.primary:hover {
    background: #3fcd70;
  }

  .footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    padding: 8px 0;
  }

  @media (min-width: 600px) {
    body { max-width: 600px; margin: 0 auto; }
  }
</style>
</head>
<body>

<h1>🔐 CIPHER</h1>

<div>
  <div class="label">Input</div>
  <textarea id="input" placeholder="Type here..."></textarea>
</div>

<div>
  <div class="label">Translation</div>
  <div class="output" id="output"></div>
</div>

<div class="row">
  <button class="primary" onclick="copyOutput()">Copy</button>
  <button onclick="clearAll()">Clear</button>
  <button onclick="swapBoxes()">↑↓</button>
</div>

<div class="footer">13-pair swap cipher • auto-translates</div>

<script>
  const pairs = {
    'R':'H','H':'R',
    'U':'O','O':'U',
    'Z':'S','S':'Z',
    'I':'E','E':'I',
    'X':'Q','Q':'X',
    'D':'T','T':'D',
    'M':'N','N':'M',
    'L':'F','F':'L',
    'J':'G','G':'J',
    'A':'Y','Y':'A',
    'P':'B','B':'P',
    'K':'C','C':'K',
    'V':'W','W':'V'
  };

  function swap(text) {
    let out = '';
    for (let ch of text) {
      const upper = ch.toUpperCase();
      if (pairs[upper]) {
        out += (ch === upper) ? pairs[upper] : pairs[upper].toLowerCase();
      } else {
        out += ch;
      }
    }
    return out;
  }

  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function update() {
    output.textContent = swap(input.value);
  }

  input.addEventListener('input', update);

  function copyOutput() {
    if (!output.textContent) return;
    navigator.clipboard.writeText(output.textContent).then(() => {
      const btn = event.target;
      const old = btn.textContent;
      btn.textContent = '✓';
      setTimeout(() => btn.textContent = old, 1000);
    });
  }

  function clearAll() {
    input.value = '';
    update();
  }

  function swapBoxes() {
    input.value = output.textContent;
    update();
  }

  // Auto-focus on load (desktop)
  if (window.innerWidth > 600) input.focus();
</script>

</body>
</html>
